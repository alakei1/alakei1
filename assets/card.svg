<svg width="800" height="540" viewBox="0 0 800 540" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;700&amp;family=Lora:wght@700&amp;display=swap');
    @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

    .tag    {font:700 10px/1 'JetBrains Mono',monospace;fill:#EBD2CD;letter-spacing:.18em}
    .title  {font:700 34px/1.2 'Lora',serif;fill:#EBD2CD}
    .excpt  {font:400 14px/1.6 'Inter',sans-serif;fill:rgba(235,210,205,0.85)}
    .aname  {font:600 13px/1 'Inter',sans-serif;fill:#EBD2CD}
    .asub   {font:400 11px/1 'Inter',sans-serif;fill:#3B887B}
    .wm     {font:400 9px/1 'Inter',sans-serif;fill:rgba(235,210,205,0.3);letter-spacing:.08em}
    .tag-g  {animation:fadeUp .4s .2s both}
    .titl-g {animation:fadeUp .5s .3s both}
    .exc-g  {animation:fadeUp .5s .5s both}
    .auth-g {animation:fadeUp .4s .7s both}
  </style>
</defs>

<!-- Основной темный изумрудный фон -->
<rect width="800" height="540" fill="#112221"/>

<!-- Top accent line fills left-to-right (Коралловый акцент) -->
<rect x="0" y="0" width="0" height="4" fill="#DB8C7B">
  <animate attributeName="width" from="0" to="800" dur=".5s" fill="freeze"/>
</rect>

<!-- Tag pill -->
<g transform="translate(48,44)"><g class="tag-g">
  <rect x="0" y="-20" width="86.4" height="26" rx="4" fill="#125446"/>
  <text class="tag" x="16" y="3">Mindset</text>
</g></g>

<!-- Title -->
<g transform="translate(48,80)"><g class="titl-g">
  <text class="title" x="0" y="0">Passion for software engineering&lt;/&gt;</text>
  <text class="title" x="0" y="42.5">Страсть к программной инженерии&lt;/&gt;</text>
</g></g>

<!-- Divider -->
<line x1="48" y1="160" x2="752" y2="160" stroke="#3B887B" stroke-width="1">
  <animate attributeName="opacity" from="0" to="1" dur=".3s" begin=".4s" fill="freeze"/>
</line>

<!-- Excerpt -->
<g transform="translate(48,185)"><g class="exc-g">
  <!-- Русский блок текста -->
  <text class="excpt" x="0" y="0">Мне нравится разбираться в том, как устроены современные IT-решения, и создавать</text>
  <text class="excpt" x="0" y="24">новые технологии. Мой главный принцип — непрерывное развитие, поэтому я учусь</text>
  <text class="excpt" x="0" y="48">и становлюсь лучше каждый день. Я не просто зазубриваю инструменты, а глубоко</text>
  <text class="excpt" x="0" y="72">погружаюсь в суть: мне важно досконально изучить технологию и понимать, как</text>
  <text class="excpt" x="0" y="96">работает каждая строчка кода.</text>
  
  <!-- Маленькая горизонтальная линия-разделение -->
  <line x1="0" y1="126" x2="100" y2="126" stroke="#3B887B" stroke-width="1" opacity="0.6"/>
  
  <!-- Английский блок текста -->
  <text class="excpt" x="0" y="160" font-weight="700">About Me:</text>
  <text class="excpt" x="0" y="184">I am passionate about exploring how technologies work and building innovative solutions.</text>
  <text class="excpt" x="0" y="208">Driven by continuous growth, I dedicate time every day to learning and refining my skills.</text>
  <text class="excpt" x="0" y="232">Instead of just memorizing tools, I prefer to dive deep into the core concepts, ensuring</text>
  <text class="excpt" x="0" y="256">I fully understand the logic behind every single line of code.</text>
</g></g>

<!-- Author row -->
<g transform="translate(48,492)"><g class="auth-g">
  <!-- Круглый фон аватара -->
  <circle cx="15" cy="0" r="15" fill="#125446"/>
  
  <!-- Иконка GitHub по центру круга в цвете #EBD2CD -->
  <path d="M15,-10 C9.48,-10 5,-5.52 5,0 C5,4.42 7.87,8.17 11.84,9.49 C12.34,9.58 12.52,9.27 12.52,9.01 C12.52,8.77 12.51,8.14 12.51,7.3 C9.73,7.9 9.14,5.97 9.14,5.97 C8.68,4.81 8.03,4.5 8.03,4.5 C7.12,3.88 8.1,3.89 8.1,3.89 C9.1,3.96 9.63,4.92 9.63,4.92 C10.51,6.43 11.96,6 12.53,5.74 C12.62,5.1 12.88,4.66 13.16,4.41 C10.94,4.16 8.61,3.3 8.61,-0.52 C8.61,-1.61 9,-2.5 9.64,-3.2 C9.54,-3.45 9.2,-4.47 9.74,-5.85 C9.74,-5.85 10.58,-6.12 12.49,-4.83 C13.29,-5.05 14.14,-5.16 15,-5.16 C15.86,-5.16 16.71,-5.05 17.51,-4.83 C19.42,-6.12 20.26,-5.85 20.26,-5.85 C20.8,4.47 20.46,5.49 20.36,5.74 C21,6.5 21.39,7.39 21.39,8.48 C21.39,12.31 19.05,13.16 16.83,13.41 C17.19,13.72 17.51,14.34 17.51,15.29 C17.51,16.65 17.5,17.75 17.5,18.08 C17.5,18.35 17.68,18.66 18.19,18.56 C22.15,17.23 25,13.47 25,9.01 C25,3.48 20.52,-10 15,-10 Z" 
        fill="#EBD2CD" 
        transform="scale(0.85) translate(2.6, -10.5)"/>

  <text class="aname" x="38" y="-4">@alakei</text>
  <text class="asub" x="38" y="13"></text>
</g></g>

<text class="wm" x="786" y="532" text-anchor="end">@alakey1</text>
</svg>

