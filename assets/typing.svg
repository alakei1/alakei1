<svg xmlns="http://w3.org" width="800" height="120" viewBox="0 0 800 120">
  <style>
    @import url('https://googleapis.com');
    @media (prefers-reduced-motion: reduce) {
      .root { animation: none !important; }
    }
    :root {
      animation: fadeIn 0.5s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor {
      animation: blink 1s steps(2) infinite;
      fill: #DB8C7B;
    }
  </style>

  <!-- Фон и рамка -->
  <rect width="800" height="120" rx="12" fill="#112221" stroke="#125446" stroke-width="2"/>

  <!-- Линия 0: Welcome to my GitHub profile -->
  <g class="root">
    <defs>
      <clipPath id="clip_0">
        <rect x="40" y="32" height="40" width="0">
          <animate attributeName="width" values="0;0;460.8;460.8;0;0" keyTimes="0;0.0000;0.0700;0.1700;0.1900;1" dur="15s" repeatCount="indefinite"/>
        </rect>
      </clipPath>
    </defs>
    <g>
      <text x="40" y="68" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="24" font-weight="500" fill="#EBD2CD" clip-path="url(#clip_0)" opacity="0">
        Welcome to my GitHub profile
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0700;0.1700;0.1900;1" dur="15s" repeatCount="indefinite"/>
      </text>
      <rect class="cursor" x="0" y="44" width="3" height="28" opacity="0">
        <animate attributeName="x" values="40;40;500.8;500.8;40;40" keyTimes="0;0.0000;0.0700;0.1700;0.1900;1" dur="15s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0700;0.1700;0.1900;1" dur="15s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Линия 1: Добро пожаловать в мой GitHub -->
  <g class="root">
    <defs>
      <clipPath id="clip_1">
        <rect x="40" y="32" height="40" width="0">
          <animate attributeName="width" values="0;0;475.2;475.2;0;0" keyTimes="0;0.2000;0.2700;0.3700;0.3900;1" dur="15s" repeatCount="indefinite"/>
        </rect>
      </clipPath>
    </defs>
    <g>
      <text x="40" y="68" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="24" font-weight="500" fill="#EBD2CD" clip-path="url(#clip_1)" opacity="0">
        Добро пожаловать в мой GitHub
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2000;0.2700;0.3700;0.3900;1" dur="15s" repeatCount="indefinite"/>
      </text>
      <rect class="cursor" x="0" y="44" width="3" height="28" opacity="0">
        <animate attributeName="x" values="40;40;515.2;515.2;40;40" keyTimes="0;0.2000;0.2700;0.3700;0.3900;1" dur="15s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2000;0.2700;0.3700;0.3900;1" dur="15s" repeatCount="indefinite"/>
