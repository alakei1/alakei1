<svg xmlns="http://w3.org" width="800" height="120" viewBox="0 0 800 120">
  <style>
      @import url('https://googleapis.com');
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

      .root { animation: fadeIn 0.5s ease forwards; }

      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .cursor { animation: blink 1s steps(2) infinite; fill: #F87171; }

      /* Первая фраза: "It works on my machine" (22 символа -> 316.8px) */
      @keyframes typeLine0 {
        0% { width: 0; opacity: 0; }
        0.00% { width: 0; opacity: 0; }
        0.50% { width: 0; opacity: 1; }
        11.67% { width: 316.8px; opacity: 1; }
        28.33% { width: 316.8px; opacity: 1; }
        31.67% { width: 316.8px; opacity: 0; }
        33.33% { width: 0; opacity: 0; }
        100% { width: 0; opacity: 0; }
      }
      .line0 { animation: typeLine0 9s steps(22, end) infinite; }
      
      /* Вторая фраза: "🛠 Tech Stack" (12 символов -> 172.8px) */
      @keyframes typeLine1 {
        0% { width: 0; opacity: 0; }
        33.33% { width: 0; opacity: 0; }
        33.83% { width: 0; opacity: 1; }
        45.00% { width: 172.8px; opacity: 1; }
        61.67% { width: 172.8px; opacity: 1; }
        65.00% { width: 172.8px; opacity: 0; }
        66.67% { width: 0; opacity: 0; }
        100% { width: 0; opacity: 0; }
      }
      .line1 { animation: typeLine1 9s steps(12, end) infinite; }
      
      /* Третья фраза: "Ctrl+C, Ctrl+V Expert" (21 символ -> 302.4px) */
      @keyframes typeLine2 {
        0% { width: 0; opacity: 0; }
        66.67% { width: 0; opacity: 0; }
        67.17% { width: 0; opacity: 1; }
        78.33% { width: 302.4px; opacity: 1; }
        95.00% { width: 302.4px; opacity: 1; }
        98.33% { width: 302.4px; opacity: 0; }
        100.00% { width: 0; opacity: 0; }
        100% { width: 0; opacity: 0; }
      }
      .line2 { animation: typeLine2 9s steps(21, end) infinite; }
  </style>

  <rect width="800" height="120" rx="12" fill="#030303" stroke="rgba(255,255,255,0.08)"/>
  
  <g class="root">
    <!-- ПЕРВАЯ ФРАЗА: It works on my machine -->
    <defs>
      <clipPath id="clip-0">
        <rect x="40" y="32" height="40" width="0" class="line0" />
      </clipPath>
    </defs>
    <g>
      <text x="40" y="68" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="24" font-weight="500" fill="#f4f4f5" clip-path="url(#clip-0)" opacity="0">
        It works on my machine
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.1167;0.2833;0.3167;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <rect class="cursor" x="0" y="42" width="3" height="28" opacity="0">
        <animate attributeName="x" values="40;40;356.8;356.8;40;40" keyTimes="0;0.0000;0.1167;0.2833;0.3167;1" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.1167;0.2833;0.3167;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- ВТОРАЯ ФРАЗА: 🛠 Tech Stack -->
    <defs>
      <clipPath id="clip-1">
        <rect x="40" y="32" height="40" width="0" class="line1" />
      </clipPath>
    </defs>
    <g>
      <text x="40" y="68" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="24" font-weight="500" fill="#f4f4f5" clip-path="url(#clip-1)" opacity="0">
        🛠 Tech Stack
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.4500;0.6167;0.6500;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <rect class="cursor" x="0" y="42" width="3" height="28" opacity="0">
        <animate attributeName="x" values="40;40;212.8;212.8;40;40" keyTimes="0;0.3333;0.4500;0.6167;0.6500;1" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.4500;0.6167;0.6500;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- ТРЕТЬЯ ФРАЗА: Ctrl+C, Ctrl+V Expert -->
    <defs>
      <clipPath id="clip-2">
        <rect x="40" y="32" height="40" width="0" class="line2" />
      </clipPath>
    </defs>
    <g>
      <text x="40" y="68" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="24" font-weight="500" fill="#f4f4f5" clip-path="url(#clip-2)" opacity="0">
        Ctrl+C, Ctrl+V Expert
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6667;0.7833;0.9500;0.9833;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <rect class="cursor" x="0" y="42" width="3" height="28" opacity="0">
        <animate attributeName="x" values="40;40;342.4;342.4;40;40" keyTimes="0;0.6667;0.7833;0.9500;0.9833;1" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6667;0.7833;0.9500;0.9833;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <text x="788" y="112" font-family="'JetBrains Mono',monospace" font-size="9" fill="#f4f4f5" opacity="0.35" text-anchor="end" letter-spacing="0.08em">coolreadme.xyz</text>
</svg>

