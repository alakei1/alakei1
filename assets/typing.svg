        <animate attributeName="x" values="40;40;529.6;529.6;40;40" keyTimes="0;0.4000;0.4700;0.5700;0.5900;1" dur="15s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4000;0.4700;0.5700;0.5900;1" dur="15s" repeatCount="indefinite"/>
      </rect>
    </g>
