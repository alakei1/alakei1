        </rect>
      </clipPath>
    </defs>
    <g>
      <text x="40" y="68" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="24" font-weight="500" fill="#EBD2CD" clip-path="url(#clip_3)" opacity="0">
        Надеюсь у вас хорошее настроение
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6000;0.6700;0.7700;0.7900;1" dur="15s" repeatCount="indefinite"/>
      </text>
      <rect class="cursor" x="0" y="44" width="3" height="28" opacity="0">
        <animate attributeName="x" values="40;40;558.4;558.4;40;40" keyTimes="0;0.6000;0.6700;0.7700;0.7900;1" dur="15s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6000;0.6700;0.7700;0.7900;1" dur="15s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Линия 4: Check out my tech stack and projects below -->
  <g class="root">
    <defs>
      <clipPath id="clip_4">
        <rect x="40" y="32" height="40" width="0">
          <animate attributeName="width" values="0;0;619.2;619.2;0;0" keyTimes="0;0.8000;0.8700;0.9700;0.9900;1" dur="15s" repeatCount="indefinite"/>
        </rect>
      </clipPath>
    </defs>
    <g>
      <text x="40" y="68" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="24" font-weight="500" fill="#EBD2CD" clip-path="url(#clip_4)" opacity="0">
        Check out my tech stack and projects below
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8000;0.8700;0.9700;0.9900;1" dur="15s" repeatCount="indefinite"/>
      </text>
      <rect class="cursor" x="0" y="44" width="3" height="28" opacity="0">
        <animate attributeName="x" values="40;40;659.2;659.2;40;40" keyTimes="0;0.8000;0.8700;0.9700;0.9900;1" dur="15s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8000;0.8700;0.9700;0.9900;1" dur="15s" repeatCount="indefinite"/>
      </rect>
    </g>
