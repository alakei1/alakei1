<svg width="780" height="70" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон с круглыми углами -->
  <rect width="780" height="70" rx="20" fill="#EBD2CD"/>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400&amp;display=swap');
    
    .text {
      font-family: 'Dancing Script', cursive;
      font-size: 32px;
      fill: #DB8C7B;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    
    @keyframes typing {
      from { width: 0; }
      to { width: 280px; }
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    
    .typing-text {
      animation: typing 3s steps(22) 1s forwards;
      overflow: visible;
      white-space: nowrap;
    }
    
    .cursor {
      animation: blink 1s step-end infinite;
    }
  </style>
  
  <!-- Текст с эффектом печати -->
  <text x="390" y="38" class="text">
    <tspan class="typing-text">Viam supervadet vadens</tspan>
  </text>
  
  <!-- Мигающий курсор -->
  <rect x="560" y="12" width="2" height="30" fill="#DB8C7B" class="cursor"/>
</svg>
