<svg width="780" height="70" xmlns="http://www.w3.org/2000/svg">
  <rect width="780" height="70" rx="20" fill="#EBD2CD"/>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400&amp;display=swap');
    
    .text {
      font-family: 'Dancing Script', cursive;
      font-size: 32px;
      fill: #DB8C7B;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    
    @keyframes type {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    
    .letter {
      animation: type 0.2s ease forwards;
      opacity: 0;
      display: inline-block;
    }
    
    .cursor {
      animation: blink 0.7s step-end infinite;
    }
    
    /* Задержки для каждой буквы */
    .l1 { animation-delay: 0.0s; }
    .l2 { animation-delay: 0.1s; }
    .l3 { animation-delay: 0.2s; }
    .l4 { animation-delay: 0.3s; }
    .l5 { animation-delay: 0.4s; }
    .l6 { animation-delay: 0.5s; }
    .l7 { animation-delay: 0.6s; }
    .l8 { animation-delay: 0.7s; }
    .l9 { animation-delay: 0.8s; }
    .l10 { animation-delay: 0.9s; }
    .l11 { animation-delay: 1.0s; }
    .l12 { animation-delay: 1.1s; }
    .l13 { animation-delay: 1.2s; }
    .l14 { animation-delay: 1.3s; }
    .l15 { animation-delay: 1.4s; }
    .l16 { animation-delay: 1.5s; }
    .l17 { animation-delay: 1.6s; }
    .l18 { animation-delay: 1.7s; }
    .l19 { animation-delay: 1.8s; }
    .l20 { animation-delay: 1.9s; }
    .l21 { animation-delay: 2.0s; }
    .l22 { animation-delay: 2.1s; }
  </style>
  
  <text x="390" y="38" class="text">
    <tspan class="letter l1">V</tspan>
    <tspan class="letter l2">i</tspan>
    <tspan class="letter l3">a</tspan>
    <tspan class="letter l4">m</tspan>
    <tspan class="letter l5"> </tspan>
    <tspan class="letter l6">s</tspan>
    <tspan class="letter l7">u</tspan>
    <tspan class="letter l8">p</tspan>
    <tspan class="letter l9">e</tspan>
    <tspan class="letter l10">r</tspan>
    <tspan class="letter l11">v</tspan>
    <tspan class="letter l12">a</tspan>
    <tspan class="letter l13">d</tspan>
    <tspan class="letter l14">e</tspan>
    <tspan class="letter l15">t</tspan>
    <tspan class="letter l16"> </tspan>
    <tspan class="letter l17">v</tspan>
    <tspan class="letter l18">a</tspan>
    <tspan class="letter l19">d</tspan>
    <tspan class="letter l20">e</tspan>
    <tspan class="letter l21">n</tspan>
    <tspan class="letter l22">s</tspan>
  </text>
  
  <rect x="560" y="12" width="2" height="30" fill="#DB8C7B" class="cursor"/>
</svg>
