<svg width="800" height="280" viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
@keyframes blink   { 0%,49%{opacity:1} 50%,100%{opacity:0} }
@keyframes fadeUp  { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
@keyframes pulse   { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .pkg  {font:700 28px/1 'Inter',sans-serif;fill:#F1F5F9;letter-spacing:-.5px}
    .ver  {font:700 12px/1 'JetBrains Mono',monospace;fill:#22D3EE;letter-spacing:.05em}
    .desc {font:400 16px/1.6 'Inter',sans-serif;fill:#94A3B8}
    .inst {font:400 14px/1 'JetBrains Mono',monospace;fill:#E2E8F0;letter-spacing:.02em}
    .prmt {font:700 13px/1 'JetBrains Mono',monospace;fill:#00FF88}
    .wm   {font:400 9px/1 'Inter',sans-serif;fill:rgba(255,255,255,.18);letter-spacing:.08em}
    .cur  {animation:blink 1s step-end infinite}
    .row1 {animation:fadeUp .4s .1s both}
    .row2 {animation:fadeUp .4s .25s both}
    .row3 {animation:fadeUp .4s .4s both}
  </style>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#22D3EE" stop-opacity=".08"/>
    <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="rgba(34,211,238,0.05)" stroke-width="1"/>
  </pattern>
</defs>

<rect width="800" height="280" fill="#0F172A"/>
<rect width="800" height="280" fill="url(#grid)"/>
<ellipse cx="200" cy="80" rx="300" ry="180" fill="url(#glow)"/>

<!-- Left cyan bar grows in -->
<rect x="0" y="0" width="4" height="0" fill="#22D3EE">
  <animate attributeName="height" from="0" to="280" dur=".6s" fill="freeze"/>
</rect>

<!-- Package name + version badge — outer g = position, inner g = animation -->
<g transform="translate(28,52)"><g class="row1">
  <text class="pkg" x="0" y="0">my-package</text>
  <rect x="0" y="14" width="67" height="24" rx="5"
        fill="rgba(34,211,238,0.13)" stroke="rgba(34,211,238,0.30)" stroke-width="1">
    <animate attributeName="opacity" from="0" to="1" dur=".3s" begin=".4s" fill="freeze"/>
  </rect>
  <text class="ver" x="11" y="30">v1.0.0</text>
</g></g>

<!-- Description -->
<g transform="translate(28,120)"><g class="row2">
  <text class="desc" x="0" y="0">A fast TypeScript SDK</text>
</g></g>

<!-- Install command block -->
<g transform="translate(28,168)"><g class="row3">
  <rect x="0" y="0" width="744" height="52" rx="8" fill="#1E293B" stroke="rgba(34,211,238,0.14)" stroke-width="1"/>
  <text class="prmt" x="18" y="31">$</text>
  <text class="inst" x="36" y="31">npm install my-package</text>
  <rect class="cur" x="239.89999999999998" y="17" width="7" height="16" fill="#4b5563" rx="1"/>
</g></g>

<text class="wm" x="786" y="272" text-anchor="end">coolreadme.xyz</text>
</svg>