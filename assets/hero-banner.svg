<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&amp;display=swap');
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes waveMove { 0% { transform: translateX(0); } 100% { transform: translateX(-200px); } }
      @keyframes waveMove2 { 0% { transform: translateX(0); } 100% { transform: translateX(200px); } }
      @keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 0.85; } }

      .root  { animation: fadeIn 0.6s ease forwards; }
      .title { animation: fadeIn 0.7s ease 0.1s both; }
      .sub   { animation: fadeIn 0.7s ease 0.25s both; }
      .wave1 { animation: waveMove 9s linear infinite; }
      .wave2 { animation: waveMove2 12s linear infinite; }
      .glow  { animation: pulse 4s ease-in-out infinite; }
    </style>

    <!-- Animated linear gradient: shift stop offsets over time -->
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171">
        <animate attributeName="stop-color" values="#F87171;#fc3390;#7090bf;#F87171" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#fc3390">
        <animate attributeName="stop-color" values="#fc3390;#7090bf;#F87171;#fc3390" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7090bf">
        <animate attributeName="stop-color" values="#7090bf;#F87171;#fc3390;#7090bf" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="g2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a14949" stop-opacity="0.6">
        <animate attributeName="stop-color" values="#a14949;#fc3390;#a14949" dur="11s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#F87171" stop-opacity="0.4">
        <animate attributeName="stop-color" values="#F87171;#7090bf;#F87171" dur="11s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="fadeOverlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030303" stop-opacity="0"/>
      <stop offset="100%" stop-color="#030303" stop-opacity="0.55"/>
    </linearGradient>

    <clipPath id="card-clip">
      <rect width="800" height="200" rx="14"/>
    </clipPath>
  </defs>

  <g class="root" clip-path="url(#card-clip)">
    <!-- Base bg -->
    <rect width="800" height="200" fill="#030303"/>
    <!-- Gradient fill 1 -->
    <rect width="800" height="200" fill="url(#g1)" opacity="0.85"/>

    <!-- Wavy band 1 (drifts left) -->
    <g class="wave1 glow" style="transform-origin: center;">
      <path d="M -200 110 C 0 70, 200 150, 400 100 S 800 90, 1200 120 L 1200 200 L -200 200 Z"
            fill="url(#g2)" opacity="0.7"/>
    </g>

    <!-- Wavy band 2 (drifts right, slower) -->
    <g class="wave2" style="transform-origin: center;">
      <path d="M -200 140 C 100 100, 300 180, 500 130 S 900 150, 1300 110 L 1300 200 L -200 200 Z"
            fill="#F87171" opacity="0.35"/>
    </g>

    <!-- Bottom fade to keep text legible -->
    <rect width="800" height="200" fill="url(#fadeOverlay)"/>

    <!-- Title -->
    <text class="title" x="400" y="96"
          font-family="'Inter', sans-serif" font-size="44" font-weight="900"
          fill="#f4f4f5" text-anchor="middle" letter-spacing="-1.2">alaxey lugachev</text>

    <!-- Subtitle -->
    <text class="sub" x="400" y="136"
          font-family="'Inter', sans-serif" font-size="16" font-weight="500"
          fill="rgba(244,244,245,0.7)" text-anchor="middle" letter-spacing="0.04em">Full-stack engineer · building in public</text>
  </g>

  <text x="788" y="192" font-family="'Inter',sans-serif" font-size="9" fill="#f4f4f5" opacity="0.4" text-anchor="end" letter-spacing="0.08em">coolreadme.xyz</text>
</svg>