<svg width="100%" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EBD2CD" />
      <stop offset="50%" style="stop-color:#DB8C7B" />
      <stop offset="100%" style="stop-color:#3B887B" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#DB8C7B" />
      <stop offset="100%" style="stop-color:#125446" />
    </linearGradient>
  </defs>

  <rect width="100%" height="120" fill="url(#grad)"/>

  <!-- Волна 1 -->
  <path d="M0,60 Q100,30 200,60 T400,60 T600,60 T800,60 L800,120 L0,120 Z" 
        fill="#DB8C7B" opacity="0.6">
    <animate attributeName="d" 
             values="M0,60 Q100,30 200,60 T400,60 T600,60 T800,60 L800,120 L0,120 Z;
                     M0,60 Q100,90 200,60 T400,60 T600,60 T800,60 L800,120 L0,120 Z;
                     M0,60 Q100,30 200,60 T400,60 T600,60 T800,60 L800,120 L0,120 Z" 
             dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- Волна 2 -->
  <path d="M0,80 Q150,50 300,80 T600,80 T900,80 L900,120 L0,120 Z" 
        fill="#3B887B" opacity="0.5">
    <animate attributeName="d" 
             values="M0,80 Q150,50 300,80 T600,80 T900,80 L900,120 L0,120 Z;
                     M0,80 Q150,110 300,80 T600,80 T900,80 L900,120 L0,120 Z;
                     M0,80 Q150,50 300,80 T600,80 T900,80 L900,120 L0,120 Z" 
             dur="5s" repeatCount="indefinite"/>
  </path>

  <!-- Волна 3 -->
  <path d="M0,100 Q200,70 400,100 T800,100 L800,120 L0,120 Z" 
        fill="#125446" opacity="0.4">
    <animate attributeName="d" 
             values="M0,100 Q200,70 400,100 T800,100 L800,120 L0,120 Z;
                     M0,100 Q200,130 400,100 T800,100 L800,120 L0,120 Z;
                     M0,100 Q200,70 400,100 T800,100 L800,120 L0,120 Z" 
             dur="6s" repeatCount="indefinite"/>
  </path>
</svg>
