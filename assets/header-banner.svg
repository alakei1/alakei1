<svg width="1200" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиентный фон -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EBD2CD;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#DB8C7B;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#EBD2CD;stop-opacity:1"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#125446" opacity="0.06"/>
    </pattern>
  </defs>
  
  <!-- Заливка -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#dots)"/>
  
  <!-- Декоративные круги -->
  <circle cx="100" cy="350" r="80" fill="#3B887B" opacity="0.05"/>
  <circle cx="1100" cy="50" r="120" fill="#DB8C7B" opacity="0.05"/>
  <circle cx="600" cy="200" r="150" fill="#125446" opacity="0.03"/>
  
  <!-- Основной текст -->
  <text x="600" y="150" font-family="Arial, sans-serif" font-weight="700" font-size="52" fill="#125446" text-anchor="middle">
    Alexey Lugachev
  </text>
  
  <!-- Подзаголовок -->
  <text x="600" y="210" font-family="Arial, sans-serif" font-weight="400" font-size="24" fill="#3B887B" text-anchor="middle">
    Backend · ML Engineer · DevOps
  </text>
  
  <!-- Нижняя подпись -->
  <text x="600" y="260" font-family="'Dancing Script', cursive" font-size="28" fill="#DB8C7B" text-anchor="middle" opacity="0.7">
    Viam supervadet vadens
  </text>
</svg>
