<svg xmlns="http://www.w3.org/2000/svg" width="800" height="120" viewBox="0 0 800 120">
  <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&amp;display=swap');
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

      .root { animation: fadeIn 0.5s ease forwards; }

      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .cursor { animation: blink 1s steps(2) infinite; fill: #F87171; }
  </style>
  
  <rect width="800" height="120" rx="12" fill="#030303" stroke="rgba(255,255,255,0.08)"/>
  
  <g class="root">
    
    <!-- СТРОКА 1: Hello world! (Ширина 12 символов * 14.4px = 172.8px) -->
    <!-- Так как текст раскрывается от центра, курсор должен двигаться от x=400 до x=486.4 -->
    <defs>
      <clipPath id="clip-0">
        <rect x="400" y="32" height="40" width="0">
          <animate attributeName="x" values="400;400;313.6;313.6;400;400" keyTimes="0;0.0000;0.1167;0.2833;0.3167;1" dur="9s" repeatCount="indefinite"/>
          <animate attributeName="width" values="0;0;172.8;172.8;0;0" keyTimes="0;0.0000;0.1167;0.2833;0.3167;1" dur="9s" repeatCount="indefinite"/>
        </rect>
      </clipPath>
    </defs>
    <g>
      <text x="400" y="68" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="24" font-weight="500" fill="#f4f4f5" clip-path="url(#clip-0)" opacity="0">
        Hello world!
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.1167;0.2833;0.3167;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <rect class="cursor" x="400" y="42" width="3" height="28" opacity="0">
        <animate attributeName="x" values="400;400;486.4;486.4;400;400" keyTimes="0;0.0000;0.1167;0.2833;0.3167;1" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.1167;0.2833;0.3167;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- СТРОКА 2: Open to work (Ширина 12 символов * 14.4px = 172.8px) -->
    <defs>
      <clipPath id="clip-1">
        <rect x="400" y="32" height="40" width="0">
          <animate attributeName="x" values="400;400;313.6;313.6;400;400" keyTimes="0;0.3333;0.4500;0.6167;0.6500;1" dur="9s" repeatCount="indefinite"/>
          <animate attributeName="width" values="0;0;172.8;172.8;0;0" keyTimes="0;0.3333;0.4500;0.6167;0.6500;1" dur="9s" repeatCount="indefinite"/>
        </rect>
      </clipPath>
    </defs>
    <g>
      <text x="400" y="68" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="24" font-weight="500" fill="#f4f4f5" clip-path="url(#clip-1)" opacity="0">
        Open to work
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.4500;0.6167;0.6500;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <rect class="cursor" x="400" y="42" width="3" height="28" opacity="0">
        <animate attributeName="x" values="400;400;486.4;486.4;400;400" keyTimes="0;0.3333;0.4500;0.6167;0.6500;1" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.4500;0.6167;0.6500;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- СТРОКА 3: Viam supervadet vadens (Ширина 22 символа * 14.4px = 316.8px) -->
    <!-- Курсор идет от центра x=400 до x=558.4 (400 + 316.8/2) -->
    <defs>
      <clipPath id="clip-2">
        <rect x="400" y="32" height="40" width="0">
          <animate attributeName="x" values="400;400;241.6;241.6;400;400" keyTimes="0;0.6667;0.7833;0.9500;0.9833;1" dur="9s" repeatCount="indefinite"/>
          <animate attributeName="width" values="0;0;316.8;316.8;0;0" keyTimes="0;0.6667;0.7833;0.9500;0.9833;1" dur="9s" repeatCount="indefinite"/>
        </rect>
      </clipPath>
    </defs>
    <g>
      <text x="400" y="68" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="24" font-weight="500" fill="#f4f4f5" clip-path="url(#clip-2)" opacity="0">
        Viam supervadet vadens
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6667;0.7833;0.9500;0.9833;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <rect class="cursor" x="400" y="42" width="3" height="28" opacity="0">
        <animate attributeName="x" values="400;400;558.4;558.4;400;400" keyTimes="0;0.6667;0.7833;0.9500;0.9833;1" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6667;0.7833;0.9500;0.9833;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </g>

  </g>
  <text x="788" y="112" font-family="'JetBrains Mono',monospace" font-size="9" fill="#f4f4f5" opacity="0.35" text-anchor="end" letter-spacing="0.08em">@alakei1</text>
</svg>

  </g>
  <text x="788" y="112" font-family="'JetBrains Mono',monospace" font-size="9" fill="#f4f4f5" opacity="0.35" text-anchor="end" letter-spacing="0.08em">@alakei1</text>
</svg>
