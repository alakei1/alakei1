<svg xmlns="http://w3.org" width="800" height="120" viewBox="0 0 800 120">
  <style>
      @import url('https://googleapis.com');
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

      .root { animation: fadeIn 0.5s ease forwards; }

      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .cursor { animation: blink 1s steps(2) infinite; fill: #F87171; }
  </style>
  
  <rect width="800" height="120" rx="12" fill="#030303" stroke="rgba(255,255,255,0.08)"/>
  
  <g class="root">
    
    <!-- СТРОКА 1: Hello world! (Старт x=50, 12 симв. * 14.4px = 172.8px, конец x=222.8) -->
    <defs>
      <clipPath id="clip-0">
        <rect x="50" y="32" height="40" width="0">
          <animate attributeName="width" values="0;0;172.8;172.8;0;0" keyTimes="0;0.0000;0.1167;0.2833;0.3167;1" dur="9s" repeatCount="indefinite"/>
        </rect>
      </clipPath>
    </defs>
    <g>
      <text x="50" y="68" text-anchor="start" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="24" font-weight="500" fill="#f4f4f5" clip-path="url(#clip-0)" opacity="0">
        Hello world!
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.1167;0.2833;0.3167;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <rect class="cursor" x="50" y="42" width="3" height="28" opacity="0">
        <animate attributeName="x" values="50;50;222.8;222.8;50;50" keyTimes="0;0.0000;0.1167;0.2833;0.3167;1" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.1167;0.2833;0.3167;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- СТРОКА 2: Open to work (Старт x=50, 12 симв. * 14.4px = 172.8px, конец x=222.8) -->
    <defs>
      <clipPath id="clip-1">
        <rect x="50" y="32" height="40" width="0">
          <animate attributeName="width" values="0;0;172.8;172.8;0;0" keyTimes="0;0.3333;0.4500;0.6167;0.6500;1" dur="9s" repeatCount="indefinite"/>
        </rect>
      </clipPath>
    </defs>
    <g>
      <text x="50" y="68" text-anchor="start" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="24" font-weight="500" fill="#f4f4f5" clip-path="url(#clip-1)" opacity="0">
        Open to work
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.4500;0.6167;0.6500;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <rect class="cursor" x="50" y="42" width="3" height="28" opacity="0">
        <animate attributeName="x" values="50;50;222.8;222.8;50;50" keyTimes="0;0.3333;0.4500;0.6167;0.6500;1" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.4500;0.6167;0.6500;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- СТРОКА 3: Viam supervadet vadens (Старт x=50, 22 симв. * 14.4px = 316.8px, конец x=366.8) -->
    <defs>
      <clipPath id="clip-2">
        <rect x="50" y="32" height="40" width="0">
          <animate attributeName="width" values="0;0;316.8;316.8;0;0" keyTimes="0;0.6667;0.7833;0.9500;0.9833;1" dur="9s" repeatCount="indefinite"/>
        </rect>
      </clipPath>
    </defs>
    <g>
      <text x="50" y="68" text-anchor="start" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="24" font-weight="500" fill="#f4f4f5" clip-path="url(#clip-2)" opacity="0">
        Viam supervadet vadens
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6667;0.7833;0.9500;0.9833;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <rect class="cursor" x="50" y="42" width="3" height="28" opacity="0">
        <animate attributeName="x" values="50;50;366.8;366.8;50;50" keyTimes="0;0.6667;0.7833;0.9500;0.9833;1" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6667;0.7833;0.9500;0.9833;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </g>

  </g>
  <text x="788" y="112" font-family="'JetBrains Mono',monospace" font-size="9" fill="#f4f4f5" opacity="0.35" text-anchor="end" letter-spacing="0.08em">@alakei1</text>
</svg>
