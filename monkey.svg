<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
    @keyframes wave {
      0%, 100% { transform: rotate(-10deg); }
      50% { transform: rotate(20deg); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes tailWag {
      0%, 100% { transform: rotate(-15deg); }
      50% { transform: rotate(15deg); }
    }
    
    .monkey {
      animation: bounce 1.5s ease-in-out infinite;
    }
    .hand-wave {
      animation: wave 0.8s ease-in-out infinite;
      transform-origin: 140px 80px;
    }
    .tail {
      animation: tailWag 1s ease-in-out infinite;
      transform-origin: 60px 160px;
    }
    .eye {
      animation: blink 3s ease-in-out infinite;
    }
  </style>
  
  <!-- Тело -->
  <ellipse cx="100" cy="130" rx="45" ry="50" fill="#8B5E3C"/>
  
  <!-- Живот -->
  <ellipse cx="100" cy="140" rx="30" ry="35" fill="#D2A679"/>
  
  <!-- Голова -->
  <circle cx="100" cy="80" r="40" fill="#8B5E3C"/>
  
  <!-- Морда -->
  <ellipse cx="100" cy="90" rx="25" ry="20" fill="#D2A679"/>
  
  <!-- Уши -->
  <circle cx="65" cy="70" r="12" fill="#8B5E3C"/>
  <circle cx="65" cy="70" r="6" fill="#D2A679"/>
  <circle cx="135" cy="70" r="12" fill="#8B5E3C"/>
  <circle cx="135" cy="70" r="6" fill="#D2A679"/>
  
  <!-- Глаза -->
  <circle cx="88" cy="80" r="5" fill="white" class="eye"/>
  <circle cx="112" cy="80" r="5" fill="white" class="eye"/>
  <circle cx="89" cy="80" r="2.5" fill="black"/>
  <circle cx="113" cy="80" r="2.5" fill="black"/>
  
  <!-- Зрачки блик -->
  <circle cx="90" cy="79" r="1" fill="white"/>
  <circle cx="114" cy="79" r="1" fill="white"/>
  
  <!-- Нос -->
  <ellipse cx="100" cy="88" rx="8" ry="5" fill="#6B3A2A"/>
  
  <!-- Рот (улыбка) -->
  <path d="M 90 95 Q 100 105 110 95" stroke="#6B3A2A" stroke-width="2" fill="none"/>
  
  <!-- Хвост (с анимацией) -->
  <path d="M 60 155 Q 30 170 20 150 Q 10 130 30 120" stroke="#8B5E3C" stroke-width="8" fill="none" stroke-linecap="round" class="tail"/>
  
  <!-- Левая рука -->
  <path d="M 60 110 Q 40 120 35 140" stroke="#8B5E3C" stroke-width="8" fill="none" stroke-linecap="round"/>
  
  <!-- Правая рука (машет) -->
  <g class="hand-wave">
    <path d="M 140 110 Q 160 105 165 85" stroke="#8B5E3C" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Ладошка -->
    <circle cx="165" cy="83" r="8" fill="#D2A679"/>
  </g>
  
  <!-- Ноги -->
  <ellipse cx="80" cy="175" rx="15" ry="8" fill="#8B5E3C"/>
  <ellipse cx="120" cy="175" rx="15" ry="8" fill="#8B5E3C"/>
  
  <!-- Ступни -->
  <ellipse cx="75" cy="180" rx="12" ry="6" fill="#D2A679"/>
  <ellipse cx="125" cy="180" rx="12" ry="6" fill="#D2A679"/>
</svg>
